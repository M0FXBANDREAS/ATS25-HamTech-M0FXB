name: Build ATS25 HamTech V1.0 Receiver
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install platformio
      - name: Build V1.0 receiver
        run: pio run
      - name: Verify V1.0 binary
        run: strings .pio/build/esp32dev/firmware.bin | grep -F "ATS-25 HamTech M0FXB Controller V1.0"
      - name: Package firmware
        run: |
          mkdir -p firmware
          cp .pio/build/esp32dev/firmware.bin firmware/
          cp .pio/build/esp32dev/bootloader.bin firmware/
          cp .pio/build/esp32dev/partitions.bin firmware/
          sha256sum firmware/*.bin > firmware/SHA256SUMS.txt
          printf 'VERSION=V1.0-RECEIVER\nGITHUB_SHA=%s\n' "$GITHUB_SHA" > firmware/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATS25-HamTech-M0FXB-V1.0-RECEIVER
          path: firmware/
