name: Build ATS25 HamTech V1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - run: pip install platformio
      - run: pio run
      - name: Prove V1.0
        run: strings .pio/build/esp32dev/firmware.bin | grep -F "ATS-25 HamTech M0FXB Controller V1.0"
      - name: Package
        run: |
          mkdir firmware
          cp .pio/build/esp32dev/{firmware.bin,bootloader.bin,partitions.bin} firmware/
          sha256sum firmware/*.bin > firmware/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATS25-HamTech-M0FXB-V1.0
          path: firmware/
