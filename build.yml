name: Build ATS25 HamTech V1.1 Beta
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install platformio
      - name: Build
        run: pio run
      - name: Verify V1.1 marker
        run: grep -a -q 'ATS-25 HamTech M0FXB Controller V1.1 BETA' .pio/build/esp32dev/firmware.bin
      - name: Package
        run: |
          mkdir firmware
          cp .pio/build/esp32dev/firmware.bin firmware/
          sha256sum firmware/firmware.bin > firmware/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATS25-HamTech-M0FXB-V1.1-BETA
          path: firmware/
