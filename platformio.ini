[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions/ats25_factory_4mb.csv
lib_deps =
  https://github.com/pu2clr/SI4735.git
build_flags =
  -DCORE_DEBUG_LEVEL=0
